[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 1
opt-level = 1

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "3.0.0"
publish = false
edition = "2024"

[workspace.dependencies]
templates = { path = "crates/templates" }
utilities = { path = "crates/utilities" }

# External crates
axum = { version = "0.8.8", features = ["http2", "macros", "ws"] }
chrono = { version = "0.4.44", features = ["now"] }
dotenvy = "0.15.7"
futures = "0.3.32"
glob = "0.3.3"
grass = "0.13.4"
maud = { version = "0.27.0", features = ["axum"] }
num-format = "0.4.4"
reqwest = { version = "0.13.2", features = ["json"] }
sea-orm = { version = "2.0.0-rc.37", features = [ "sqlx-postgres", "sqlx-sqlite", "runtime-tokio", "macros", "with-chrono", "with-json" ] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "normalize-path"] }
